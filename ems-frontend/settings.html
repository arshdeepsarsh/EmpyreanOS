<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — EmpyreanOS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Minimal specific styling for the vertical tabs to match the theme */
    .settings-nav .nav-link {
      color: var(--text-secondary);
      font-family: var(--font-main);
      font-weight: 500;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      text-align: left;
      transition: all 0.2s;
    }
    .settings-nav .nav-link:hover:not(.active) {
      background: var(--surface-2);
      color: var(--text-primary);
    }
    .settings-nav .nav-link.active {
      background: var(--indigo-100);
      color: var(--indigo-700);
    }
    .pref-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-logo">E</div>
    <div class="brand-name">Empyrean<span>OS</span></div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    <button class="nav-link" style="color: #ff7b7b;" onclick="logout()">
      <i class="fa-solid fa-right-from-bracket fa-fw"></i>
      <span>Sign Out</span>
    </button>
  </div>
</div>

<div class="sub-sidebar" id="subSidebar"></div>

<div class="main-content" id="mainContent">
  <div class="topbar">
    <div class="topbar-title">System Settings</div>
    <div class="topbar-actions">
      <img id="topbarAvatar" class="avatar" width="34" height="34">
      <span id="topbarUserName" style="font-size:13.5px; font-weight:500; color:var(--text-primary);"></span>
    </div>
  </div>

  <div class="page-body">
    <div class="row g-4">
      
      <div class="col-md-3">
        <div class="card h-100">
          <div class="card-body p-3">
            <div class="nav flex-column nav-pills settings-nav" id="v-pills-tab" role="tablist" aria-orientation="vertical">
              <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-profile" type="button">
                <i class="fa-solid fa-user me-3"></i> My Profile
              </button>
              <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-security" type="button">
                <i class="fa-solid fa-shield-halved me-3"></i> Security
              </button>
              <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-preferences" type="button">
                <i class="fa-solid fa-sliders me-3"></i> Preferences
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-9">
        <div class="card h-100">
          <div class="card-body p-4">
            <div class="tab-content" id="v-pills-tabContent">
              
              <div class="tab-pane fade show active" id="tab-profile" role="tabpanel">
                <h5 class="mb-4" style="font-family: var(--font-main); color: var(--text-primary); border-bottom: 1px solid var(--border); padding-bottom: 15px;">Personal Information</h5>
                <form id="profileForm">
                  <div class="row g-3 mb-3">
                    <div class="col-md-6 form-group">
                      <label class="form-label">Full Name</label>
                      <input type="text" class="form-control" id="profName" required>
                    </div>
                    <div class="col-md-6 form-group">
                      <label class="form-label">Email Address</label>
                      <input type="email" class="form-control" id="profEmail" required>
                    </div>
                  </div>
                  <div class="row g-3 mb-4">
                    <div class="col-md-6 form-group">
                      <label class="form-label">Mobile Number</label>
                      <input type="text" class="form-control" id="profMobile" required>
                    </div>
                    <div class="col-md-6 form-group">
                      <label class="form-label">System Role & Designation</label>
                      <input type="text" class="form-control" id="profRole" style="background: var(--surface-2); color: var(--text-muted);" disabled>
                      <small style="font-size: 11px; color: var(--text-muted); margin-top: 4px; display: block;">Contact your Boss to change your role or designation.</small>
                    </div>
                  </div>
                  <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-2"></i> Update Profile</button>
                </form>
              </div>

              <div class="tab-pane fade" id="tab-security" role="tabpanel">
                <h5 class="mb-4" style="font-family: var(--font-main); color: var(--text-primary); border-bottom: 1px solid var(--border); padding-bottom: 15px;">Change Password</h5>
                <form id="securityForm">
                  <div class="form-group mb-3" style="max-width: 400px;">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" id="newPass" placeholder="Enter new password" required>
                  </div>
                  <div class="form-group mb-4" style="max-width: 400px;">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirmPass" placeholder="Repeat new password" required>
                  </div>
                  <button type="submit" class="btn btn-red"><i class="fa-solid fa-key me-2"></i> Update Password</button>
                </form>
              </div>

              <div class="tab-pane fade" id="tab-preferences" role="tabpanel">
                <h5 class="mb-4" style="font-family: var(--font-main); color: var(--text-primary); border-bottom: 1px solid var(--border); padding-bottom: 15px;">App Preferences</h5>
                
                <div class="pref-box" id="themeBox">
                  <div>
                    <h6 class="mb-1" style="font-family: var(--font-main); color: var(--text-primary);">Dark Mode</h6>
                    <small style="color: var(--text-muted);">Switch the OS interface to a dark theme.</small>
                  </div>
                  <div class="form-check form-switch fs-4 mb-0">
                    <input class="form-check-input" type="checkbox" id="darkModeToggle" style="cursor: pointer;">
                  </div>
                </div>

                <div class="pref-box" id="notifBox">
                  <div>
                    <h6 class="mb-1" style="font-family: var(--font-main); color: var(--text-primary);">Email Notifications</h6>
                    <small style="color: var(--text-muted);">Receive daily attendance and payroll reports via email.</small>
                  </div>
                  <div class="form-check form-switch fs-4 mb-0">
                    <input class="form-check-input" type="checkbox" id="emailNotifToggle" checked style="cursor: pointer;">
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
      
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="sidebar.js"></script>
<script>
  const currentUserId = localStorage.getItem('currentUserId');
  const role = localStorage.getItem('userRole');
  let fullUserData = {}; 

  document.addEventListener('DOMContentLoaded', () => {
    SidebarBuilder.init();

    // Dark Mode Initialization
    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
      document.getElementById('darkModeToggle').checked = true;
    }

    fetchMyProfile();
  });

  async function fetchMyProfile() {
    try {
      const response = await fetch(`http://localhost:8080/employees/${currentUserId}`);
      fullUserData = await response.json(); 
      document.getElementById('profName').value = fullUserData.name;
      document.getElementById('profEmail').value = fullUserData.email;
      document.getElementById('profMobile').value = fullUserData.mobile || '';
      document.getElementById('profRole').value = `${fullUserData.role} — ${fullUserData.designation || 'Staff'}`;
    } catch (error) {
      alert("Error loading profile from database.");
    }
  }

  // --- Profile Update ---
  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    fullUserData.name = document.getElementById('profName').value;
    fullUserData.email = document.getElementById('profEmail').value;
    fullUserData.mobile = document.getElementById('profMobile').value;

    try {
      const response = await fetch(`http://localhost:8080/employees/${currentUserId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fullUserData)
      });
      
      if (response.ok) {
        localStorage.setItem('currentUserName', fullUserData.name);
        alert("Profile updated successfully!");
        // Refresh sidebar and topbar name
        document.getElementById('topbarUserName').textContent = fullUserData.name;
      }
    } catch (error) { alert("Failed to update profile."); }
  });

  // --- Password Update ---
  document.getElementById('securityForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPass = document.getElementById('newPass').value;
    const confirmPass = document.getElementById('confirmPass').value;

    if (newPass !== confirmPass) {
      alert("Passwords do not match! Please try again.");
      return;
    }
    
    fullUserData.password = newPass;

    try {
      const response = await fetch(`http://localhost:8080/employees/${currentUserId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fullUserData)
      });
      
      if (response.ok) {
        alert("Password changed securely! You will be asked to use it next time you log in.");
        document.getElementById('securityForm').reset();
      }
    } catch (error) { alert("Failed to secure password."); }
  });

  // --- Dark Mode Toggle ---
  const darkModeToggle = document.getElementById('darkModeToggle');
  
  darkModeToggle.addEventListener('change', (e) => {
    if (e.target.checked) {
      document.body.classList.add('dark-mode');
      localStorage.setItem('darkMode', 'true');
    } else {
      document.body.classList.remove('dark-mode');
      localStorage.setItem('darkMode', 'false');
    }
  });
</script>
</body>
</html>
